            <h1>第50問 駐車料金の早見表</h1>
            <p>1時間あたり300円の駐車場があります。1時間から5時間までとめたときの料金の早見表を、上から順に表示しよう。何時間目かを数えている変数は i です。くり返しの終わりの数と、300 にかける数の2か所の穴をうめよう</p>
            <p>難易度：★★☆☆☆（2／やさしい）。単元：繰り返し。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>i を 1 から ［A］ まで 1 ずつ増やしながら繰り返す:
  ryoukin = 300 * ［B］
  表示する(i + &quot;時間で&quot; + ryoukin + &quot;円&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>4</code></li>
                <li><code>5</code></li>
                <li><code>6</code></li>
                <li><code>i</code></li>
                <li><code>300</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>料金は「1時間あたりの金額 × とめた時間」なので 300 * i です。とめた時間は、くり返しのたびに 1, 2, 3, 4, 5 と変わる i のこと。for は終わりの数もふくめてくり返すので、1時間から5時間までなら 1 から 5 までと書きます。300円、600円、900円、1200円、1500円と5行出れば正解です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>5</code></li>
            <li>空欄 ［B］ … <code>i</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>4</code>　［B］<code>i</code> … 4時間ぶんまでしか表示されません。i は1から始まり、終わりの数もふくめてくり返すので、5時間ぶん出すには 5 と書きます</li>
            <li>［A］<code>6</code>　［B］<code>i</code> … 6時間ぶんまで表示されてしまいます。終わりの数もふくめてくり返すので、1から6だと6回です。5 と書きます</li>
            <li>［A］<code>5</code>　［B］<code>300</code> … 300 * 300 ＝ 90000円になってしまいます。かけるのは金額ではなく「とめた時間」です。時間は 1, 2, 3 … と変わっていくので i を入れます</li>
            <li>［A］<code>5</code>　［B］<code>5</code> … どの行も 300 * 5 ＝ 1500円になり、5行とも同じ料金の表になってしまいます。1時間目は1、2時間目は2 … と変わる i をかけます</li>
            <li>［A］<code>5</code>　［B］<code>4</code> … どの行も 300 * 4 ＝ 1200円になってしまいます。かける数は決まった数ではなく、くり返しのたびに変わる i です</li>
            </ul>
