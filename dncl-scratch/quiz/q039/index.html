        <article>
            <h1>第39問 点数を10点きざみにする</h1>
            <p>テストの点数 ten（＝87点）を、10点きざみ（…70点、80点、90点）に切りそろえて表示するようにしよう。87点なら80点になります。まず10でわって小数を切り捨て、そのあと10でもとの大きさにもどします（2か所の穴をうめよう）</p>
            <p>難易度：★★☆☆☆（2／やさしい）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>ten = 87
wari = ten ［A］ 10
kiri = 切り捨て(wari)
kizami = kiri ［B］ 10
表示する(&quot;10点きざみにすると&quot; + kizami + &quot;点です&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>10点きざみにするコツは「10でわる → 切り捨てる → 10をかける」。87 / 10 ＝ 8.7、切り捨てて8、8 * 10 ＝ 80 で80点になります</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>/</code></li>
            <li>空欄 ［B］ … <code>*</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>%</code>　［B］<code>*</code> … % は10でわった「あまり」なので 87 % 10 ＝ 7、10倍しても70点になってしまいます。ほしいのは「10がいくつ分か」なので / でわりましょう</li>
            <li>［A］<code>/</code>　［B］<code>/</code> … 87 / 10 ＝ 8.7 を切り捨てて8。ここでさらにわると 8 / 10 ＝ 0.8 と小さくなります。10がいくつ分かを点数にもどすには10をかけます</li>
            <li>［A］<code>*</code>　［B］<code>*</code> … 87 * 10 ＝ 870 は切り捨てても870のまま。さらに10倍で8700点になります。まずは10でわって「10が何個分か」を求めましょう</li>
            <li>［A］<code>/</code>　［B］<code>+</code> … 87 / 10 ＝ 8.7 を切り捨てて8。ここに10をたすと18点です。8は「10のかたまりが8個」という意味なので、たすのではなく10をかけます</li>
            <li>［A］<code>-</code>　［B］<code>*</code> … 87 - 10 ＝ 77 を切り捨てても77、10倍して770点。ひき算では10点きざみになりません。10でわって切り捨て、10をかけるのが手順です</li>
            </ul>
