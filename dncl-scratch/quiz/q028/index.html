            <h1>第28問 摂氏を華氏に変換</h1>
            <p>摂氏の気温 C（＝20）を華氏に変換して表示するようにしよう。華氏は「摂氏を9倍して5でわり、32をたす」で求められます。まず9倍した bai を、5でわって shou を、最後に32をたして F を作ります（2か所の穴をうめよう）</p>
            <p>難易度：★★☆☆☆（2／やさしい）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>C = 20
bai = C ［A］ 9
shou = bai / 5
F = shou ［B］ 32
表示する(&quot;摂氏&quot; + C + &quot;度は華氏&quot; + F + &quot;度&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>華氏 ＝ 摂氏 × 9 ÷ 5 ＋ 32 です。「9倍」は * 、最後の「32をたす」は + を使います。20 * 9 ＝ 180、180 / 5 ＝ 36、36 + 32 ＝ 68 と考えよう</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>*</code></li>
            <li>空欄 ［B］ … <code>+</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>*</code>　［B］<code>-</code> … 最後は32をたします。36 - 32 ＝ 4 になってしまいます。+ を使って 36 + 32 ＝ 68 とします</li>
            <li>［A］<code>/</code>　［B］<code>+</code> … 「9倍」なのでわり算ではなくかけ算です。20 / 9 では9倍になりません。* を使って 20 * 9 ＝ 180 とします</li>
            <li>［A］<code>+</code>　［B］<code>+</code> … 「9倍」はたし算ではなくかけ算です。20 + 9 ＝ 29 では9倍になりません。* を使って 20 * 9 ＝ 180 とします</li>
            <li>［A］<code>*</code>　［B］<code>*</code> … 最後は32をかけるのではなくたします。36 * 32 ＝ 1152 と大きくなりすぎます。+ を使って 36 + 32 ＝ 68 とします</li>
            </ul>
