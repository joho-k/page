            <h1>第44問 半分にしぼると何回でたどりつく？</h1>
            <p>1024ページの辞書から目当ての言葉をさがすとき、まん中を開いて「前半と後半のどちらにあるか」を決め、のこりを半分にしぼっていきます。のこり nokori が1ページになるまでに何回しぼればよいか、kaisu で数えて表示しよう。あてはまる記号を選ぼう（3か所の穴をうめよう）</p>
            <p>難易度：★★★☆☆（3／標準）。単元：繰り返し。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>nokori = 1024
kaisu = 0
nokori ［A］ 1 の間繰り返す:
  nokori = nokori ［B］ 2
  kaisu = kaisu ［C］ 1
表示する(&quot;のこりは&quot; + nokori + &quot;ページ、しぼった回数は&quot; + kaisu + &quot;回です&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>&gt;</code></li>
                <li><code>&gt;=</code></li>
                <li><code>&lt;</code></li>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>半分にしぼる作業は「のこりが1ページより多いあいだ（nokori &gt; 1）」だけくり返します。1回しぼるごとに、のこりは半分（nokori / 2）、回数は1つふえます（kaisu + 1）。1024ページでもたった10回でたどりつけます（2を10回かけると1024になるからです）</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>&gt;</code></li>
            <li>空欄 ［B］ … <code>/</code></li>
            <li>空欄 ［C］ … <code>+</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>&gt;=</code>　［B］<code>/</code>　［C］<code>+</code> … 止めたいのは「のこりが1ページになったとき」です。&gt;= だと nokori が1のときにもう1回しぼってしまい、1 / 2 ＝ 0.5 で「のこりは0.5ページ」、回数も10回ではなく11回と出てしまいます。1ページより多いあいだだけ続けたいので &gt; を使います</li>
            <li>［A］<code>&gt;</code>　［B］<code>%</code>　［C］<code>+</code> … % はわり算の「あまり」です。1024 % 2 ＝ 0 なので1回でのこりが0ページになり、「1回でたどりついた」とおかしな答えになります。半分にするのはわり算の / です</li>
            <li>［A］<code>&gt;</code>　［B］<code>-</code>　［C］<code>+</code> … - だと1回に2ページずつしか減らないので、512回もかかってしまいます。半分にしぼるのは「2をひく」ではなく「2でわる」です</li>
            <li>［A］<code>&gt;</code>　［B］<code>/</code>　［C］<code>/</code> … kaisu は0から始まるので、1でわっても 0 / 1 ＝ 0 のままで「0回」と出てしまいます。何回しぼったかは1回ずつ数えたいので kaisu + 1 とたし算にしましょう</li>
            <li>［A］<code>&gt;=</code>　［B］<code>%</code>　［C］<code>+</code> … 2か所ちがいます。くらべるのは &gt; （1ページより多いあいだだけ続ける）、しぼり方は nokori / 2 （2でわって半分）です</li>
            </ul>
