        <article>
            <h1>第44問 半分にしぼると何回でたどりつく？</h1>
            <p>1000ページの辞書から目当ての言葉をさがすとき、まん中を開いて「前半と後半のどちらにあるか」を決め、のこりを半分にしぼっていきます。のこり nokori が1ページになるまでに何回しぼればよいか、kaisu で数えて表示しよう。ページ数に小数はないので、半分にするときは小数を切り捨てます（3か所の穴をうめよう）</p>
            <p>難易度：★★★☆☆（3／標準）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>nokori = 1000
kaisu = 0
nokori ［A］ 1 の間繰り返す:
  nokori = ［B］
  kaisu = ［C］
表示する(&quot;のこりは&quot; + nokori + &quot;ページ、しぼった回数は&quot; + kaisu + &quot;回です&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>&gt;</code></li>
                <li><code>&gt;=</code></li>
                <li><code>切り捨て(nokori / 2)</code></li>
                <li><code>nokori / 2</code></li>
                <li><code>切り捨て(nokori / 3)</code></li>
                <li><code>kaisu + 1</code></li>
                <li><code>kaisu * 2</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>半分にしぼる作業は「のこりが1ページより多いあいだ（nokori &gt; 1）」だけくり返します。1回しぼるごとに nokori は 切り捨て(nokori / 2)、kaisu は kaisu + 1 です。1000ページでもたった9回でたどりつけます（1回ごとに半分になるので、2を9回かけると約1000になるからです）</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>&gt;</code></li>
            <li>空欄 ［B］ … <code>切り捨て(nokori / 2)</code></li>
            <li>空欄 ［C］ … <code>kaisu + 1</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>&gt;=</code>　［B］<code>切り捨て(nokori / 2)</code>　［C］<code>kaisu + 1</code> … 止めたいのは「のこりが1ページになったとき」です。&gt;= だと nokori が1のときにもう1回しぼってしまい、切り捨て(1 / 2) ＝ 0 で「のこり0ページ」になり、回数も9回ではなく10回と出てしまいます。1ページより多いあいだだけ続けたいので &gt; を使います</li>
            <li>［A］<code>&gt;</code>　［B］<code>nokori / 2</code>　［C］<code>kaisu + 1</code> … 切り捨てがないので 125 / 2 ＝ 62.5 のように小数が出てしまい、最後は「のこりは0.9765625ページ」というありえない表示になります。ページは整数なので 切り捨て(nokori / 2) で小数を落としましょう</li>
            <li>［A］<code>&gt;</code>　［B］<code>切り捨て(nokori / 3)</code>　［C］<code>kaisu + 1</code> … まん中を1か所開いて「前か後ろか」を決めるので、のこりは3分の1ではなく2分の1になります。/ 3 だと 1000→333→111→37→12→4→1 の6回と、実際より少なく数えてしまいます</li>
            <li>［A］<code>&gt;</code>　［B］<code>切り捨て(nokori / 2)</code>　［C］<code>kaisu * 2</code> … kaisu は0から始まるので、2倍しても 0 * 2 ＝ 0 のままです。何回しぼったかは1回ずつ数えたいので kaisu + 1 を使いましょう</li>
            <li>［A］<code>&gt;=</code>　［B］<code>nokori / 2</code>　［C］<code>kaisu + 1</code> … 2か所ちがいます。くらべるのは &gt; （1ページより多いあいだだけ続ける）、しぼり方は 切り捨て(nokori / 2)（小数を落として半分）です</li>
            </ul>
