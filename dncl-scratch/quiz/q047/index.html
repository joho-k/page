            <h1>第47問 関数が返すのはどの値？</h1>
            <p>関数は、よく使う処理に名前をつけてまとめたものです。ここでは、2つの数を受け取って合計を返す関数 tashizan を作りました。関数の中では、受け取った a と b を足した結果を goukei に入れています。呼び出したところに合計を持ち帰るには、どの値を返せばよいでしょうか。あてはまるものを選ぼう</p>
            <p>難易度：★☆☆☆☆（1／入門）。単元：関数。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>関数 tashizan(a, b):
  goukei = a + b
  ［A］ を返す
kekka = tashizan(4, 3)
表示する(&quot;4と3を足すと&quot; + kekka)</code></pre>
            <p>空欄 ［A］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>goukei</code></li>
                <li><code>a</code></li>
                <li><code>b</code></li>
                <li><code>kekka</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>「〜 を返す」は、その値を呼び出したところへ持ち帰る合図です。tashizan(4, 3) の場所に、返した値がそのまま入ります</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>goukei</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>a</code> … a は受け取った1つ目の値そのものなので、返ってくるのは 4 だけです。足し算の答えは goukei に入っているので、goukei を返しましょう</li>
            <li>［A］<code>b</code> … b は受け取った2つ目の値そのものなので、返ってくるのは 3 だけです。足し算の答えは goukei に入っているので、goukei を返しましょう</li>
            <li>［A］<code>kekka</code> … kekka は関数の外の変数です。関数の中から外の変数は見えないので、値が無いあつかいになってしまいます。関数の中で作った goukei を返しましょう</li>
            </ul>
