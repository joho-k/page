            <h1>第59問 じゃんけんの勝ち負け（3つでひとまわり）</h1>
            <p>じゃんけんの手を グー＝0、チョキ＝1、パー＝2 という数字で表します。Aさんはパー（2）、Bさんはグー（0）を出しました。グー→チョキ→パー→グー…と3つの手はひとまわりしているので、sa ＝ te_a - te_b + 3 を「3でひとまわり」させた値 kekka を見ると、0のときはあいこ、そうでないときは勝ち負けが決まります。勝ち負けを正しく表示するには、あてはまるものはどれ？（2か所の穴をうめよう）</p>
            <p>難易度：★★★★☆（4／やや難しい）。単元：条件分岐。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>te_a = 2
te_b = 0
sa = te_a - te_b + 3
kekka = sa ［A］ 3
表示する(&quot;kekkaは&quot; + kekka + &quot;です&quot;)
もし kekka == 0 ならば:
  表示する(&quot;あいこ&quot;)
そうでなければ:
  もし kekka == ［B］ ならば:
    表示する(&quot;Aさんの勝ち&quot;)
  そうでなければ:
    表示する(&quot;Bさんの勝ち&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>%</code></li>
                <li><code>/</code></li>
                <li><code>*</code></li>
                <li><code>-</code></li>
                <li><code>0</code></li>
                <li><code>1</code></li>
                <li><code>2</code></li>
                <li><code>3</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>グー（0）→チョキ（1）→パー（2）→グー…と手は3つでひとまわりします。Aさんはパー（2）、Bさんはグー（0）なので sa ＝ 2 - 0 + 3 ＝ 5。これを 3 でわったあまり（%）にすると 5 % 3 ＝ 2 です。じつは「グーがチョキに勝つ」「チョキがパーに勝つ」ときも同じ 2 になるので、kekka が 2 のときがAさんの勝ちです</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>%</code></li>
            <li>空欄 ［B］ … <code>2</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>%</code>　［B］<code>1</code> … kekka は 5 % 3 ＝ 2 になるので、kekka == 1 は成り立たず「Bさんの勝ち」と表示されてしまいます。でもパー（2）はグー（0）に勝ちます。グーがチョキに勝つとき（2-1+3）% 3、チョキがパーに勝つとき（1-2+3）% 3 もどちらも 2 です。Aさんが勝つ番号は 2 のほうです</li>
            <li>［A］<code>%</code>　［B］<code>3</code> … 3 でわったあまりは 0・1・2 のどれかにしかならないので、kekka == 3 は一生成り立ちません。だれが何を出しても「Bさんの勝ち」になってしまいます。あまりとしてありえる 2 を選びましょう</li>
            <li>［A］<code>%</code>　［B］<code>0</code> … kekka == 0 のときは、ひとつ外側の「もし」ですでに「あいこ」と表示されています。だから内側にもう一度 0 と書いても、そこには絶対にたどりつきません。ここに書くのはAさんが勝つときの番号 2 です</li>
            <li>［A］<code>-</code>　［B］<code>2</code> … 5 - 3 ＝ 2 なので、この組み合わせだけはたまたま「Aさんの勝ち」と正しく出ます。でもグー（0）とパー（2）を入れかえると sa は 0-2+3 ＝ 1 で、1 - 3 ＝ -2 というマイナスの値になり、判定できません。0〜2 にきちんとおさめるには、ひくのではなく、わったあまりを出す % を使います</li>
            <li>［A］<code>/</code>　［B］<code>2</code> … / は商なので 5 / 3 ＝ 1.66… という小数になり、kekka == 2 にも 0 にもならず「Bさんの勝ち」と表示されます。「3つでひとまわり」を数字にするのは、商ではなく、わったあまりの % です</li>
            <li>［A］<code>*</code>　［B］<code>2</code> … * だと 5 * 3 ＝ 15 とどんどん大きくなり、0・1・2 のどれにもなりません。手は3つでひとまわりするので、3 でわったあまりを出す % を使います</li>
            <li>［A］<code>/</code>　［B］<code>1</code> … 2か所ちがいます。ひとまわりの計算はわり算の商（/）ではなく、あまり（%）です。そして 5 % 3 ＝ 2 なので、Aさんが勝つ番号は 1 ではなく 2 です</li>
            <li>［A］<code>*</code>　［B］<code>3</code> … 2か所ちがいます。かけ算では 0〜2 におさまりません。3 でわったあまり（%）を出し、Aさんが勝つ番号 2 とくらべましょう</li>
            </ul>
