            <h1>第59問 白黒の画像を短く書く（ランレングス圧縮）</h1>
            <p>白黒の画像の1行ぶんを、白を0・黒を1として配列 data（＝[1,1,1,0,0,0,0,1,1,0]）に入れました。同じ色がつづくところを「1が3個」「0が4個」のように、色と個数の組にまとめると、データを短く書けます（ランレングス圧縮）。となりどうしをくらべて、同じ色なら個数 kazu を1ふやし、色が変わったら前の色と個数を表示して数えなおします。正しく「1が3個」「0が4個」「1が2個」「0が1個」と表示されるように、プログラムを完成させよう（2か所の穴をうめよう）</p>
            <p>難易度：★★★★★（5／難しい）。単元：条件分岐・繰り返し・配列。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>data = [1,1,1,0,0,0,0,1,1,0]
kazu = 1
i を 1 から 9 まで 1 ずつ増やしながら繰り返す:
  もし data[i] ［A］ data[i - 1] ならば:
    kazu = kazu + 1
  そうでなければ:
    表示する(data[i - 1] + &quot;が&quot; + kazu + &quot;個&quot;)
    kazu = ［B］
表示する(data[9] + &quot;が&quot; + kazu + &quot;個&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>==</code></li>
                <li><code>!=</code></li>
                <li><code>&gt;</code></li>
                <li><code>0</code></li>
                <li><code>1</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>となりどうし data[i] と data[i - 1] が同じ色なら kazu を1ふやすので、くらべる記号は ==（イコールイコール）です。色が変わったら、前の色 data[i - 1] とその個数を表示し、data[i] を新しい色の1個目として kazu = 1 から数えなおします。最後のまとまりはくり返しの中では表示されないので、くり返しのあとで data[9] と kazu を表示しています。10個の数字が4組の「色と個数」にまとまりました</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>==</code></li>
            <li>空欄 ［B］ … <code>1</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>==</code>　［B］<code>0</code> … くらべ方は正解です。でも色が変わったときに kazu を0にすると、新しい色の1個目を数えそこねます。data[i] はもう新しい色の1個目なので、数えなおしは1から。0だと「1が3個」「0が3個」「1が1個」「0が0個」と、2つ目からの個数が1つずつ少なくなります</li>
            <li>［A］<code>!=</code>　［B］<code>1</code> … 数えなおしの1は正解です。でも != は「ちがう色なら」なので、同じ色がつづいているところで表示してしまい、色が変わったところで数をふやすという逆の動きになります。最初から「1が1個」「1が1個」…と、まとまりになりません</li>
            <li>［A］<code>!=</code>　［B］<code>0</code> … 2か所とも違います。!= だと同じ色のところで表示してしまい、さらに0から数えなおすので、「1が1個」「1が0個」…のように個数もずれてしまいます。同じ色かどうかは == で調べ、数えなおしは1からです</li>
            <li>［A］<code>&gt;</code>　［B］<code>1</code> … 数えなおしの1は正解です。でも &gt; だと「0から1に変わったとき」だけ数がふえ、1と1のように同じ色がつづいても表示してしまいます。最初から「1が1個」「1が1個」「1が1個」…となり、まとまりになりません。同じ色かどうかを調べる記号を選びましょう</li>
            <li>［A］<code>&gt;</code>　［B］<code>0</code> … 2か所とも違います。&gt; は大きさをくらべる記号で、同じ色かどうかは調べられません。さらに0から数えなおすので、個数も1つずつ少なくなります</li>
            </ul>
