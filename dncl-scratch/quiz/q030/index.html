            <h1>第30問 画像のデータ量</h1>
            <p>デジタル画像は小さな点（画素）が並んでできています。横640画素・縦480画素で、1画素あたり24ビットで色を表す画像は何バイトになるでしょうか。画素数・全体のビット数・バイト数の順に計算しよう。1バイトは8ビットです（3か所の穴をうめよう）</p>
            <p>難易度：★★★☆☆（3／標準）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>yoko = 640
tate = 480
irobit = 24
gasosu = yoko ［A］ tate
sobit = gasosu ［B］ irobit
byte = sobit ［C］ 8
表示する(&quot;画素数は&quot; + gasosu + &quot;画素、データ量は&quot; + byte + &quot;バイトです&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>画素数は 横 × 縦。全体のビット数は 画素数 × 1画素のビット数。バイト数はビット数 ÷ 8（1バイト＝8ビット）です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>*</code></li>
            <li>空欄 ［B］ … <code>*</code></li>
            <li>空欄 ［C］ … <code>/</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>+</code>　［B］<code>*</code>　［C］<code>/</code> … 画素は縦横にびっしり並んでいるので、640 + 480 ＝ 1120 ではありません。横の640個が480行ぶん並ぶので、* を使って 640 * 480 ＝ 307200画素です</li>
            <li>［A］<code>*</code>　［B］<code>+</code>　［C］<code>/</code> … 1画素につき24ビット使うので、307200画素ぶんの合計はかけ算です。+ だと 307200 + 24 で24ビットしか増えません。* を使いましょう</li>
            <li>［A］<code>*</code>　［B］<code>*</code>　［C］<code>*</code> … 1バイト＝8ビットなので、ビット数を8でわるとバイト数になります。* だと逆に8倍になってしまいます。/ を使いましょう</li>
            <li>［A］<code>*</code>　［B］<code>*</code>　［C］<code>%</code> … % はわり算の「あまり」です。7372800 % 8 はあまりの0になってしまいます。何バイトぶんあるかを知りたいので、わり算の / を使いましょう</li>
            <li>［A］<code>*</code>　［B］<code>/</code>　［C］<code>/</code> … 1画素あたり24ビットを「使う」ので、わり算ではなくかけ算です。/ だと 307200 / 24 ＝ 12800 とかえって小さくなってしまいます</li>
            <li>［A］<code>*</code>　［B］<code>*</code>　［C］<code>-</code> … 8ビットのかたまりが何個あるかを数えるので、ひき算ではありません。- だと 7372800 - 8 とほとんど減りません。8でわって 921600バイトを求めます</li>
            </ul>
