            <h1>第60問 10秒の音は何バイト？（音のデータ量）</h1>
            <p>音をデジタルにするときは、1秒間に何回も音の大きさを測り（標本化）、測った値を決まったビット数で記録します（量子化）。1秒間に8000回測り、1回を16ビットで記録すると、10秒間の音は何バイトになるでしょうか。1秒ぶんのビット数・全体のビット数・バイト数の順に計算します。1バイトは8ビットです（2か所の穴をうめよう）</p>
            <p>難易度：★★☆☆☆（2／やさしい）。単元：変数と代入。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>kaisu = 8000
bit = 16
byo = 10
ichibyo = kaisu ［A］ bit
zenbu = ichibyo * byo
byte = zenbu ［B］ 8
表示する(&quot;10秒の音のデータ量は&quot; + byte + &quot;バイトです&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>手順は3つ。①1秒ぶんのビット数は 測る回数 × 1回のビット数（8000 * 16 ＝ 128000）②全体のビット数は 1秒ぶん × 秒数（128000 * 10 ＝ 1280000）③バイト数はビット数 ÷ 8（1280000 / 8 ＝ 160000）。答えは160000バイトです</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>*</code></li>
            <li>空欄 ［B］ … <code>/</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>+</code>　［B］<code>/</code> … 1回測るごとに16ビット使うので、8000回ぶんはかけ算です。+ だと 8000 + 16 ＝ 8016 にしかなりません。* を使って 8000 * 16 ＝ 128000ビットにしましょう</li>
            <li>［A］<code>-</code>　［B］<code>/</code> … 測るたびにビット数は増えていくので、ひき算ではありません。- だと 8000 - 16 ＝ 7984 と減ってしまいます。8000回ぶん集めるので * を使います</li>
            <li>［A］<code>/</code>　［B］<code>/</code> … 1回で16ビットを使うので、わり算ではありません。/ だと 8000 / 16 ＝ 500 と小さくなってしまいます。16ビットが8000回ぶんあるので * を使います</li>
            <li>［A］<code>%</code>　［B］<code>/</code> … % はわり算の「あまり」です。8000 % 16 ＝ 0 なので、データ量が0バイトになってしまいます。1秒ぶんのビット数はかけ算で求めます</li>
            <li>［A］<code>*</code>　［B］<code>*</code> … 1バイトは8ビットなので、ビットをバイトに直すと数は8分の1になります。* だと 1280000 * 8 ＝ 10240000 と逆に8倍になってしまいます。/ を使いましょう</li>
            <li>［A］<code>*</code>　［B］<code>%</code> … % はわり算の「あまり」です。1280000 % 8 ＝ 0 なので、データ量が0バイトになってしまいます。8ビットのかたまりが何個あるかを知りたいので / を使いましょう</li>
            <li>［A］<code>*</code>　［B］<code>-</code> … 8ビットのかたまりが何個あるかを数えるので、ひき算ではありません。- だと 1280000 - 8 ＝ 1279992 と、ほとんど減りません。8でわりましょう</li>
            <li>［A］<code>*</code>　［B］<code>+</code> … ビットからバイトに直すと数は小さくなるはずです。+ だと 1280000 + 8 ＝ 1280008 と増えてしまいます。1バイトは8ビットなので、8でわりましょう</li>
            </ul>
