        <article>
            <h1>第56問 配列の番号は0から（3人目の点数）</h1>
            <p>4人のテストの点数が、配列 tensu に左から順に入っています。3人目の点数を取り出して表示したい。取り出す番号（添字）を bangou に入れてから tensu[bangou] で取り出します。配列の番号は 0 から数えることに気をつけて、bangou に入る数を選ぼう</p>
            <p>難易度：★☆☆☆☆（1／入門）。単元：配列。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>tensu = [60,75,90,85]
bangou = ［A］
san = tensu[bangou]
表示する(&quot;3人目の点数は&quot; + san + &quot;点&quot;)</code></pre>
            <p>空欄 ［A］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>0</code></li>
                <li><code>1</code></li>
                <li><code>2</code></li>
                <li><code>3</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>番号は左から 0, 1, 2, 3 の順です。tensu[0] が 60、tensu[1] が 75、tensu[2] が 90、tensu[3] が 85。3人目の 90 を取り出す番号はどれかな</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>2</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>0</code> … tensu[0] は左はしの 60 で、1人目の点数です。0 番が1人目なので、3人目は 0 から2つ進んだところにあります</li>
            <li>［A］<code>1</code> … tensu[1] は2人目の 75 です。番号は 0 から数えるので、番号は「何人目」より1つ小さくなります。3人目なら 3 - 1 です</li>
            <li>［A］<code>3</code> … 3人目だから 3 と書きたくなりますが、tensu[3] は右はしの 85（4人目）です。番号が 0 から始まるぶん、1つずれてしまいます</li>
            </ul>
