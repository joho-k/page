            <h1>第56問 無回答をのぞいて平均を出す（アンケートの集計）</h1>
            <p>6人に「授業の満足度」を5段階（1〜5）でたずね、答えを配列 kotae（＝[4,5,-1,3,-1,4]）に入れました。-1 は「無回答」というしるしで、点数ではありません。無回答の人をとばして、答えた人だけの平均点を出そう。goukei には答えた人の点数の合計、ninzu には答えた人の人数を数えていきます。最後にわる数を何にするかがポイントです（3か所の穴をうめよう）</p>
            <p>難易度：★★★★☆（4／やや難しい）。単元：条件分岐・繰り返し・配列。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>kotae = [4,5,-1,3,-1,4]
goukei = 0
ninzu = 0
i を 0 から 5 まで 1 ずつ増やしながら繰り返す:
  もし kotae[i] ［A］ 0 ならば:
    goukei = goukei + ［B］
    ninzu = ninzu + 1
heikin = goukei / ［C］
表示する(&quot;答えた人は&quot; + ninzu + &quot;人、平均は&quot; + heikin + &quot;点です&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>&gt;</code></li>
                <li><code>&lt;</code></li>
                <li><code>!=</code></li>
                <li><code>kotae[i]</code></li>
                <li><code>1</code></li>
                <li><code>6</code></li>
                <li><code>ninzu</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>アンケートには「無回答」がまざることがあり、-1 のような点数にならない値でしるしを付けます。これをそのまま計算に入れると平均がくるってしまうので、まず kotae[i] &gt; 0 で「答えた人」だけを選びます。えらんだ人の点数を goukei にたし、同時に ninzu で人数を数えておくのがコツ。最後は goukei / ninzu、つまり「合計 ÷ 答えた人数」でわります。全体の6人でわらないように気をつけよう。答えは、答えた人が4人、平均は4点です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>&gt;</code></li>
            <li>空欄 ［B］ … <code>kotae[i]</code></li>
            <li>空欄 ［C］ … <code>ninzu</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>&gt;</code>　［B］<code>kotae[i]</code>　［C］<code>6</code> … 無回答をとばすところまでは正しく、goukei は 16、ninzu は 4 になります。ところが最後を 6 でわると 16 ÷ 6 ＝ 2.66… となり、答えていない2人まで「0点の人」として数えたのと同じことになってしまいます。平均は「合計 ÷ 答えた人数」なので、わる数は ninzu です</li>
            <li>［A］<code>&gt;</code>　［B］<code>1</code>　［C］<code>ninzu</code> … goukei に 1 をたしていくと、点数ではなく人数を数えることになります。goukei も ninzu も 4 になり、平均は 4 ÷ 4 ＝ 1 点。合計にたすのは、その人の答えた点数 kotae[i] です</li>
            <li>［A］<code>&gt;</code>　［B］<code>6</code>　［C］<code>ninzu</code> … 6 は人数であって点数ではありません。答えた4人ぶん 6 ずつたして goukei は 24 になり、平均は 24 ÷ 4 ＝ 6 点。5段階のアンケートなのに6点という、ありえない答えになります。たすのは kotae[i] です</li>
            <li>［A］<code>!=</code>　［B］<code>kotae[i]</code>　［C］<code>ninzu</code> … kotae[i] != 0 は「0ではないとき」という意味です。-1 も 0 ではないので、無回答の2人もそのまま合計に入ってしまいます。goukei は 16 - 2 ＝ 14、ninzu は 6 になり、平均は 2.33… 点。点数として使えるのは1以上の値なので、kotae[i] &gt; 0 でふるいわけます</li>
            <li>［A］<code>!=</code>　［B］<code>kotae[i]</code>　［C］<code>6</code> … 2か所ちがいます。!= 0 では -1 の人も数に入ってしまい、さらに 6 でわると「無回答の人も答えた」ことになります。正しくは kotae[i] &gt; 0 で答えた人だけを選び、その人数 ninzu でわります</li>
            <li>［A］<code>&lt;</code>　［B］<code>kotae[i]</code>　［C］<code>ninzu</code> … &lt; だと「0より小さい人」＝無回答の人だけを集めることになります。goukei は -2、ninzu は 2 で、平均は -1 点。とりたいのは無回答ではなく、答えた人の方なので &gt; を使います</li>
            <li>［A］<code>&lt;</code>　［B］<code>1</code>　［C］<code>6</code> … 3か所ともちがいます。答えた人を選ぶのは kotae[i] &gt; 0、合計にたすのはその人の点数 kotae[i]、最後にわるのは答えた人数 ninzu です</li>
            <li>［A］<code>&gt;</code>　［B］<code>kotae[i]</code>　［C］<code>1</code> … 1 でわっても数は変わらないので、平均ではなく合計の 16 がそのまま表示されます。平均を出すには、合計を「答えた人数」でわる必要があります。その人数は ninzu に数えてあります</li>
            </ul>
