            <h1>第56問 40%で当たるおみくじ</h1>
            <p>「当たりが出る確率40%」のおみくじを作ろう。関数 omikuji は、乱数()を使って0以上1未満のランダムな数を r に入れ、r が当たりの範囲におさまっていれば「当たり」、そうでなければ「はずれ」を返すように、1箇所の穴を埋めよう</p>
            <p>難易度：★★★☆☆（3／標準）。単元：条件分岐・繰り返し・関数。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>関数 omikuji():
  r = 乱数()
  もし r &lt; ［A］ ならば:
    &quot;当たり&quot; を返す
  そうでなければ:
    &quot;はずれ&quot; を返す
i を 1 から 5 まで 1 ずつ増やしながら繰り返す:
  kekka = omikuji()
  表示する(i + &quot;回目は&quot; + kekka)</code></pre>
            <p>空欄 ［A］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>0.4</code></li>
                <li><code>0.6</code></li>
                <li><code>4</code></li>
                <li><code>40</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>乱数() は 0 以上 1 未満の数を返します。0 から 1 までの帯のうち、0 から 0.4 までのぶんはちょうど4割。だから r &lt; 0.4 を当たりにすれば、確率40%のおみくじになります。乱数を使っているので実行するたびに結果は変わりますが、何回もためすと4割くらいが「当たり」になります</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>0.4</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>0.6</code> … 0.6 だと、0 から 0.6 までが当たりの範囲になります。これは全体の6割なので60%です。当たりを4割にしたいので、区切るところは 0.4 です</li>
            <li>［A］<code>4</code> … 乱数() が返すのは0以上1未満の数なので、r は必ず 4 より小さくなります。つまり r &lt; 4 はいつでも成り立ち、10回引けば10回とも当たり＝100%です。40%は「0.4」と書きます</li>
            <li>［A］<code>40</code> … 40% の「40」をそのまま入れたくなりますが、r は0以上1未満の数なので、r &lt; 40 はいつでも成り立ちます。ぜんぶ当たりになってしまいます。1 のうちの4割なので 0.4 です</li>
            </ul>
