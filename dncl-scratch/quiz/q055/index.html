            <h1>第55問 いちばん長く続いたのは何日？（連続記録）</h1>
            <p>8日ぶんの勉強の記録が配列 kiroku に入っています（1＝勉強した日、0＝休んだ日）。いちばん長く続けられたのは何日連続だったかを求めよう。いま何日続いているかを renzoku で数え、これまでの最高記録を saidai に残します。休んだ日が来たら数えなおしになることに気をつけよう（3か所の穴をうめよう）</p>
            <p>難易度：★★★★★（5／難しい）。単元：条件分岐・繰り返し・配列。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>kiroku = [1,1,0,1,1,1,0,1]
renzoku = 0
saidai = 0
i を 0 から 7 まで 1 ずつ増やしながら繰り返す:
  もし kiroku[i] == 1 ならば:
    renzoku = renzoku ［A］ 1
    もし renzoku ［B］ saidai ならば:
      saidai = renzoku
  そうでなければ:
    renzoku = ［C］
表示する(&quot;いちばん長く続いたのは&quot; + saidai + &quot;日&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>&gt;</code></li>
                <li><code>&lt;</code></li>
                <li><code>0</code></li>
                <li><code>1</code></li>
                <li><code>renzoku</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>やることは3つです。①勉強した日（kiroku[i] が 1）なら renzoku に 1 をたす ②その renzoku が saidai より大きければ saidai を書きかえる ③休んだ日なら renzoku を 0 に戻す。この記録では 1,1 で2日 → 休み → 1,1,1 で3日 → 休み → 1 で1日 なので、答えは3日です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>+</code></li>
            <li>空欄 ［B］ … <code>&gt;</code></li>
            <li>空欄 ［C］ … <code>0</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>+</code>　［B］<code>&gt;</code>　［C］<code>1</code> … 休んだ日に renzoku を 1 にすると、休んだ日を1日ぶん数えたことになります。0 に戻さないと連続が切れたことになりません。この記録では 4日連続 と出てしまいます（本当は 3日）。数えなおしは 0 からです</li>
            <li>［A］<code>+</code>　［B］<code>&lt;</code>　［C］<code>0</code> … &lt; だと「今の連続が最高記録より短いとき」に記録を書きかえてしまいます。saidai は 0 のままか、短い数に上書きされるだけです。最高記録は「今のほうが長いとき」＝ &gt; のときに更新します</li>
            <li>［A］<code>-</code>　［B］<code>&gt;</code>　［C］<code>0</code> … 勉強した日は連続日数がふえるので、たし算です。- だと renzoku が 0, -1, -2 と減っていき、saidai は 0 のまま（0日）になってしまいます</li>
            <li>［A］<code>-</code>　［B］<code>&lt;</code>　［C］<code>1</code> … 3か所ともちがいます。勉強した日は renzoku に 1 をたす（+）、今の連続が最高記録より長いとき（&gt;）に saidai を書きかえる、休んだ日は renzoku を 0 に戻す、の3つがそろって最長記録が求まります</li>
            <li>［A］<code>+</code>　［B］<code>&gt;</code>　［C］<code>renzoku</code> … renzoku をそのまま入れても値は変わらないので、休んだ日でも連続が切れません。1 の数を全部たしただけの 6日 になってしまいます。連続が切れたら 0 に戻します</li>
            </ul>
