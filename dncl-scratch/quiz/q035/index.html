        <article>
            <h1>第35問 歩く速さ（時速）</h1>
            <p>12kmの道のりを3時間かけて歩きました。1時間あたり何km進んだか（時速）を表示するようにしよう</p>
            <p>難易度：★☆☆☆☆（1／入門）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>kyori = 12
jikan = 3
hayasa = kyori ［A］ jikan
表示する(&quot;時速&quot; + hayasa + &quot;kmです&quot;)</code></pre>
            <p>空欄 ［A］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>速さは「1時間あたりに進む道のり」。12kmを3時間で等しく分けると、1時間ぶんが求まるよ</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>/</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>*</code> … かけ算だと 12 × 3 で 時速36km になり、歩くどころか車なみの速さになってしまいます。12kmを3時間で「分ける」と考えよう</li>
            <li>［A］<code>+</code> … 足し算だと 12 + 3 で 時速15km。km と 時間 という種類のちがう数どうしは足せません</li>
            <li>［A］<code>-</code> … ひき算だと 12 - 3 で 時速9km。ひき算では「1時間あたりに進む道のり」は求められません</li>
            </ul>
