        <article>
            <h1>第43問 ダウンロードにかかる時間</h1>
            <p>200MB（メガバイト）の動画を、通信速度100Mbps（1秒間に100メガビット送れる回線）でダウンロードすると何秒かかるでしょうか。データ量は「バイト」、通信速度は「ビット」が単位なので、まず単位をビットにそろえてから、速度でわって時間を求めます。1バイトは8ビットです（2か所の穴をうめよう）</p>
            <p>難易度：★★☆☆☆（2／やさしい）。単元：変数と代入。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>size = 200
speed = 100
bit = size ［A］ 8
byo = bit ［B］ speed
表示する(&quot;データ量は&quot; + bit + &quot;メガビット、ダウンロードに&quot; + byo + &quot;秒かかります&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>手順は2つ。①バイトをビットにそろえる（1バイト＝8ビットなので 200 * 8 ＝ 1600メガビット）②通信速度でわる（1600 / 100 ＝ 16秒）。単位をそろえてからわる、が計算のコツです</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>*</code></li>
            <li>空欄 ［B］ … <code>/</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>/</code>　［B］<code>/</code> … 1バイトは8ビットなので、バイトをビットに直すと数は8倍に増えます。/ だと 200 / 8 ＝ 25 と減ってしまい、答えも 0.25秒とおかしくなります。* を使って 200 * 8 ＝ 1600メガビットにしましょう</li>
            <li>［A］<code>*</code>　［B］<code>*</code> … 1600メガビットを 1秒に100メガビット送れる回線で送るので、「100メガビットが何回分か」を数えます。* だと 1600 * 100 ＝ 160000秒（44時間以上）になってしまいます。/ でわりましょう</li>
            <li>［A］<code>+</code>　［B］<code>/</code> … 200バイトに8をたすのではありません。1バイトごとに8ビットぶんあるので、+ だと 200 + 8 ＝ 208 とほとんど増えません。8倍する * が正しいです</li>
            <li>［A］<code>-</code>　［B］<code>/</code> … - だと 200 - 8 ＝ 192 と、かえって少なくなってしまいます。バイトをビットに直すときは8倍に増えるので * を使います</li>
            <li>［A］<code>*</code>　［B］<code>-</code> … 1600 - 100 ＝ 1500 は「ビットの引き算」で、秒にはなりません。1秒あたり100メガビット送れるので、全体を100でわると何秒かかるかが出ます</li>
            <li>［A］<code>*</code>　［B］<code>%</code> … % はわり算の「あまり」です。1600 % 100 ＝ 0 になってしまい、時間が0秒になります。何秒かかるかを知りたいので / でわりましょう</li>
            <li>［A］<code>*</code>　［B］<code>+</code> … 1600 + 100 ＝ 1700 では、速度が速いほど時間が長いことになっておかしいです。速い回線ほど短い時間ですむので、速度ではわり算をします</li>
            </ul>
