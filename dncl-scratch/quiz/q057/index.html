            <h1>第57問 パスワードは何通り？（4けたの数字）</h1>
            <p>0から9までの数字が使える「4けたのパスワード」は、全部で何通り作れるでしょうか。1けたなら10通り、2けたならそのそれぞれにまた10通りずつ枝分かれ…とけたが増えるごとに通り数はふくらんでいきます。通り数を入れておく箱 kumi に、1けたぶんずつためていくプログラムです。kumi の最初の値と、繰り返しの中の計算をうめよう（2か所の穴をうめよう）</p>
            <p>難易度：★★☆☆☆（2／やさしい）。単元：繰り返し。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>shurui = 10
kumi = ［A］
i を 1 から 4 まで 1 ずつ増やしながら繰り返す:
  kumi = kumi ［B］ shurui
表示する(&quot;4けたの数字のパスワードは&quot; + kumi + &quot;通りです&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>0</code></li>
                <li><code>1</code></li>
                <li><code>10</code></li>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>かけ算をためていくときは、最初の箱に 1 を入れます（0 だと何をかけても 0 のままです）。1けたごとに10通りずつ枝分かれするので、10 を4回かけて 10 * 10 * 10 * 10 ＝ 10000通りになります</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>1</code></li>
            <li>空欄 ［B］ … <code>*</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>0</code>　［B］<code>*</code> … 0 に何をかけても 0 のままなので、4回くり返しても kumi は 0 通りのままです。たし算の合計は 0 から始めますが、かけ算をためていくときは 1 から始めます</li>
            <li>［A］<code>10</code>　［B］<code>*</code> … 最初から 10 が入っていると、そこにさらに10を4回かけて 100000 通り（5けたぶん）になってしまいます。10をかけるのは4回だけでよいので、最初は 1 です</li>
            <li>［A］<code>1</code>　［B］<code>+</code> … + だと 1 + 10 + 10 + 10 + 10 ＝ 41 通りにしかなりません。けたが1つ増えるたびに、それまでの1通り1通りが10通りずつに枝分かれするので、たし算ではなくかけ算です</li>
            <li>［A］<code>1</code>　［B］<code>-</code> … - だと 1 から10を4回ひいて -39 通りになってしまいます。通り数はけたが増えるほど多くなるので、ひき算ではなくかけ算です</li>
            <li>［A］<code>1</code>　［B］<code>/</code> … / だと 1 を10で4回わって 0.0001 になってしまいます。けたが増えるほど通り数は多くなるので、わり算ではなくかけ算です</li>
            <li>［A］<code>0</code>　［B］<code>+</code> … 2か所とも違います。+ では 0 + 10 + 10 + 10 + 10 ＝ 40 通りにしかなりません。かけ算を 1 からためていくのが正しい形です</li>
            <li>［A］<code>10</code>　［B］<code>+</code> … 10 + 10 + 10 + 10 + 10 ＝ 50 通りです。4けたのパスワードは50通りよりずっと多く作れます。1 から始めて10をかけていきましょう</li>
            <li>［A］<code>0</code>　［B］<code>-</code> … 0 から10を4回ひいて -40 通りになります。通り数がマイナスになることはありません。1 から始めて10をかけていきましょう</li>
            <li>［A］<code>10</code>　［B］<code>-</code> … 10 から10を4回ひいて -30 通りになります。けたが増えるほど通り数は多くなるので、かけ算を使います</li>
            <li>［A］<code>0</code>　［B］<code>/</code> … 0 を10でわっても 0 のままです。かけ算をためていくときの最初の値は 1、計算は * です</li>
            <li>［A］<code>10</code>　［B］<code>/</code> … 10 を10で4回わると 0.001 になってしまいます。通り数を増やしたいので * を使い、最初は 1 から始めます</li>
            </ul>
