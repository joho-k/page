            <h1>第53問 駐車料金の早見表</h1>
            <p>1時間あたり300円の駐車場があります。1時間から5時間までとめたときの料金の早見表を、上から順に表示しよう。何時間目かを数えている変数は i です。くり返しの終わりの数と、料金を計算する記号の2か所の穴をうめよう</p>
            <p>難易度：★★☆☆☆（2／やさしい）。単元：繰り返し。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>i を 1 から ［A］ まで 1 ずつ増やしながら繰り返す:
  ryoukin = 300 ［B］ i
  表示する(i + &quot;時間で&quot; + ryoukin + &quot;円&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>4</code></li>
                <li><code>5</code></li>
                <li><code>6</code></li>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>料金は「1時間あたりの金額 × とめた時間」なので 300 * i です。for は終わりの数もふくめてくり返すので、1時間から5時間までなら 1 から 5 までと書きます。300円、600円、900円、1200円、1500円と5行出れば正解です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>5</code></li>
            <li>空欄 ［B］ … <code>*</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>4</code>　［B］<code>*</code> … 4時間ぶんまでしか表示されません。i は1から始まり、終わりの数もふくめてくり返すので、5時間ぶん出すには 5 と書きます</li>
            <li>［A］<code>6</code>　［B］<code>*</code> … 6時間ぶんまで表示されてしまいます。終わりの数もふくめてくり返すので、1から6だと6回です。5 と書きます</li>
            <li>［A］<code>5</code>　［B］<code>+</code> … 300 + i では1時間ごとに1円ずつしか増えません。1時間で301円になってしまいます。「1時間あたり300円」は300を時間の数だけかけるので * を使います</li>
            <li>［A］<code>5</code>　［B］<code>/</code> … 300 / i では時間がのびるほど安くなってしまいます。2時間で150円ではおかしいですね。* を使って 300 * 2 ＝ 600 とします</li>
            <li>［A］<code>5</code>　［B］<code>-</code> … 300 - i では1時間ごとに1円ずつ安くなってしまいます。「1時間あたり300円」は300を時間の数だけかけるので * を使います</li>
            </ul>
