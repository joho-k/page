            <h1>第67問 花だんのまわりの長さは？（長方形）</h1>
            <p>たて3m、よこ5mの長方形の花だんがあります。花だんのまわりにぐるっと1周ロープを張るとき、ロープの長さ（まわりの長さ）が表示されるようにしよう。長方形のまわりには、たての辺とよこの辺が2本ずつあります</p>
            <p>難易度：★☆☆☆☆（1／入門）。単元：変数と代入。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>tate = 3
yoko = 5
mawari = (tate + yoko) ［A］ 2
表示する(&quot;まわりの長さは&quot; + mawari + &quot;m&quot;)</code></pre>
            <p>空欄 ［A］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>*</code></li>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>/</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>たて + よこ で、まわりの半分（半周ぶん）の長さになります。たての辺とよこの辺は2本ずつあるので、それを2倍すれば1周ぶんです。* はかけ算の記号です。(3 + 5) * 2 ＝ 16 で、答えは16mです</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>*</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>+</code> … (3 + 5) + 2 ＝ 10 となり、たてとよこを1本ずつ足して2をおまけしただけになります。たての辺もよこの辺も2本ずつあるので、(たて + よこ) を2倍しましょう</li>
            <li>［A］<code>-</code> … (3 + 5) - 2 ＝ 6 となり、たてとよこを1本ずつ足した8mより短くなってしまいます。まわりの長さは辺が2本ずつなので、(たて + よこ) を2倍しましょう</li>
            <li>［A］<code>/</code> … (3 + 5) / 2 ＝ 4 となり、半分にしてしまっています。ロープは1周ぶん必要なので、たて＋よこ（半周ぶん）を2倍しましょう</li>
            </ul>
