            <h1>第45問 おつりの硬貨の枚数</h1>
            <p>1780円のおつりを、500円玉・100円玉・10円玉を使って、できるだけ少ない枚数でわたします。それぞれ何枚になるかを表示しよう。大きい硬貨から順に「わり算の商（小数は切り捨て）がその硬貨の枚数」「わったあまりが次に回す残り」になります。あてはまる記号を選ぼう（3か所の穴をうめよう）</p>
            <p>難易度：★★★☆☆（3／標準）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>tsuri = 1780
go = 切り捨て(tsuri / 500)
nokori = tsuri ［A］ 500
hyaku = 切り捨て(nokori / 100)
hasuu = nokori ［B］ 100
juu = hasuu ［C］ 10
表示する(&quot;500円玉が&quot; + go + &quot;枚&quot;)
表示する(&quot;100円玉が&quot; + hyaku + &quot;枚&quot;)
表示する(&quot;10円玉が&quot; + juu + &quot;枚&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>大きい硬貨から順に「金額 / 硬貨の額 ＝ 枚数」「金額 % 硬貨の額 ＝ 次に回す残り」の2本立てです。1780円なら 500円玉は 切り捨て(1780 / 500) ＝ 3枚、残りは 1780 % 500 ＝ 280円、と進みます</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>%</code></li>
            <li>空欄 ［B］ … <code>%</code></li>
            <li>空欄 ［C］ … <code>/</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>/</code>　［B］<code>%</code>　［C］<code>/</code> … 1つ目は「500円玉をわたしたあとの残り」です。/ だと 1780 / 500 ＝ 3.56 という枚数まじりの数になり、100円玉が0枚とおかしくなります。残りは 1780 % 500 ＝ 280 円と、あまりで求めます</li>
            <li>［A］<code>-</code>　［B］<code>%</code>　［C］<code>/</code> … 500円玉は3枚わたすので、ひくなら 1780 - 1500 です。- だと1枚ぶんの 1780 - 500 ＝ 1280 しかひけず、100円玉が12枚になってしまいます。何枚ぶんでも一度にひける % を使いましょう</li>
            <li>［A］<code>%</code>　［B］<code>/</code>　［C］<code>/</code> … 2つ目は「100円玉もわたしたあとの残り」です。/ だと 280 / 100 ＝ 2.8 となり、10円玉が0.28枚とおかしくなります。残りは 280 % 100 ＝ 80 円と、あまりで求めます</li>
            <li>［A］<code>%</code>　［B］<code>-</code>　［C］<code>/</code> … 100円玉は2枚わたすので、ひくなら 280 - 200 です。- だと1枚ぶんの 280 - 100 ＝ 180 しかひけず、10円玉が18枚になってしまいます。あまりの % なら一度で 80 円になります</li>
            <li>［A］<code>%</code>　［B］<code>%</code>　［C］<code>%</code> … 10円玉の枚数は「わり算の商」です。% はあまりなので 80 % 10 ＝ 0 となり0枚になってしまいます。80円は10円玉8枚ちょうどなので、80 / 10 ＝ 8 とわり算にしましょう</li>
            </ul>
