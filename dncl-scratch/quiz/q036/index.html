            <h1>第36問 アンケートの割合（％）</h1>
            <p>クラス40人にアンケートをとったところ、34人が「毎日スマホを使う」と答えました。これは全体の何％かを求めて表示するようにしよう。割合（％）は「その人数を100倍してから、全体の人数でわる」で求められます。まず100倍した bai を、全体でわって wari を作ります（2か所の穴をうめよう）</p>
            <p>難易度：★★☆☆☆（2／やさしい）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>zentai = 40
tsukau = 34
bai = tsukau ［A］ 100
wari = bai ［B］ zentai
表示する(&quot;全体の&quot; + wari + &quot;％&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>割合（％）＝ その人数 × 100 ÷ 全体の人数 です。34 * 100 ＝ 3400、3400 / 40 ＝ 85 で、答えは85％になります</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>*</code></li>
            <li>空欄 ［B］ … <code>/</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>/</code>　［B］<code>/</code> … 「100倍」なのでわり算ではなくかけ算です。34 / 100 では小さくなってしまいます。* を使って 34 * 100 ＝ 3400 とします</li>
            <li>［A］<code>+</code>　［B］<code>/</code> … 「100倍」はたし算ではなくかけ算です。34 + 100 ＝ 134 では100倍になりません。* を使って 34 * 100 ＝ 3400 とします</li>
            <li>［A］<code>*</code>　［B］<code>*</code> … 全体の人数はかけるのではなくわります。3400 * 40 ＝ 136000 と大きくなりすぎます。/ を使って 3400 / 40 ＝ 85 とします</li>
            <li>［A］<code>*</code>　［B］<code>-</code> … 全体の人数はひくのではなくわります。3400 - 40 ＝ 3360 では割合になりません。/ を使って 3400 / 40 ＝ 85 とします</li>
            <li>［A］<code>*</code>　［B］<code>%</code> … % はわったあまりです。3400 % 40 ＝ 0 になってしまいます。あまりではなく商がほしいので / を使って 3400 / 40 ＝ 85 とします</li>
            </ul>
