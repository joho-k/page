            <h1>第38問 必要な箱の数（切り上げ）</h1>
            <p>たまごが100個あります。1箱に12個ずつ入れるとき、箱は何箱必要でしょうか。まず箱にきっちり入る数（商）を求め、つぎに入りきらない残りの個数（あまり）を求めます。残りが1個でもあるときは、そのあふれた分のために箱をもう1つ足します（3か所の穴をうめよう）</p>
            <p>難易度：★★★☆☆（3／標準）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>kosuu = 100
hitohako = 12
hako = ［A］
nokori = ［B］
もし nokori ［C］ 0 ならば:
  hako = hako + 1
表示する(&quot;箱は&quot; + hako + &quot;箱必要です&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>切り捨て(kosuu / hitohako)</code></li>
                <li><code>切り上げ(kosuu / hitohako)</code></li>
                <li><code>kosuu / hitohako</code></li>
                <li><code>kosuu % hitohako</code></li>
                <li><code>hitohako % kosuu</code></li>
                <li><code>&gt;</code></li>
                <li><code>&gt;=</code></li>
                <li><code>==</code></li>
                <li><code>&lt;</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>きっちり入る箱の数は 切り捨て(kosuu / hitohako) ＝ 8箱。入りきらない残りは kosuu % hitohako ＝ 4個。残りが1個でもある（0より大きい）ときだけ、あふれた分の1箱を足すので、答えは9箱です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>切り捨て(kosuu / hitohako)</code></li>
            <li>空欄 ［B］ … <code>kosuu % hitohako</code></li>
            <li>空欄 ［C］ … <code>&gt;</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>kosuu / hitohako</code>　［B］<code>kosuu % hitohako</code>　［C］<code>&gt;</code> … 100 / 12 ＝ 8.33… と小数になってしまいます。箱の数は整数なので、きっちり入る数は 切り捨て(kosuu / hitohako) ＝ 8箱と求めます</li>
            <li>［A］<code>切り上げ(kosuu / hitohako)</code>　［B］<code>kosuu % hitohako</code>　［C］<code>&gt;</code> … 切り上げ(100 / 12) ＝ 9 でいったん正しくなりますが、このあと「残りがあれば +1」でもう1箱ふえて10箱になってしまいます。ここは切り捨てで8箱にしておき、あふれた分を +1 で足します</li>
            <li>［A］<code>切り捨て(kosuu / hitohako)</code>　［B］<code>kosuu / hitohako</code>　［C］<code>&gt;</code> … 残りの個数は「わったあまり」です。kosuu / hitohako は 8.33… なので、たとえば96個のようにきっちり割り切れるときも 8 &gt; 0 となり、いらない1箱がふえてしまいます</li>
            <li>［A］<code>切り捨て(kosuu / hitohako)</code>　［B］<code>hitohako % kosuu</code>　［C］<code>&gt;</code> … わる順が逆です。12 % 100 ＝ 12 となり、いつでも0より大きいので必ず1箱ふえてしまいます。残りは「100を12でわったあまり」なので kosuu % hitohako です</li>
            <li>［A］<code>切り捨て(kosuu / hitohako)</code>　［B］<code>kosuu % hitohako</code>　［C］<code>&gt;=</code> … あまりは0以上なので、&gt;= 0 はいつでも成り立ちます。96個のようにきっちり割り切れて、あまりが0のときまで1箱ふえてしまいます。足すのは「あまりが0より大きいとき」だけです</li>
            <li>［A］<code>切り捨て(kosuu / hitohako)</code>　［B］<code>kosuu % hitohako</code>　［C］<code>==</code> … 条件が逆になっています。あまりが0のときは全部きっちり入っているので箱を足す必要はありません。足すのは、あまりが残っている（0より大きい）ときです</li>
            <li>［A］<code>切り捨て(kosuu / hitohako)</code>　［B］<code>kosuu % hitohako</code>　［C］<code>&lt;</code> … あまりが0より小さくなることはないので、この条件は一度も成り立ちません。8箱のままとなり、あふれた4個の行き場がなくなります</li>
            </ul>
