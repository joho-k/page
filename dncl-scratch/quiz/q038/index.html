        <article>
            <h1>第38問 あめを分けたあまり</h1>
            <p>あめが20個あります。6人で同じ数ずつ分けると、何個あまるかを表示するようにしよう。a % b と書くと「a を b でわったあまり」が計算できます</p>
            <p>難易度：★☆☆☆☆（1／入門）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>ame = 20
ninzu = 6
amari = ame ［A］ ninzu
表示する(&quot;あまりは&quot; + amari + &quot;個です&quot;)</code></pre>
            <p>空欄 ［A］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>20個を6人に同じ数ずつ配ると、1人3個ずつで18個。配りきれずに残るのがあまりです。あまりを求める記号は % だよ</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>%</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>/</code> … わり算だと 20 / 6 ＝ 3.33… となり、これは「1人分がおよそ何個か」を表す数です。ほしいのは分け終わったあとに残る個数なので、あまりを求める % を使います</li>
            <li>［A］<code>-</code> … ひき算だと 20 - 6 ＝ 14。これは1人に1個ずつ配っただけの残りで、6個ずつ配れるかぎり配ったあとの残りではありません</li>
            <li>［A］<code>*</code> … かけ算だと 20 * 6 ＝ 120 となり、あめが増えてしまいます。分けたあとに残る数はもとの20個より少ないはずです</li>
            <li>［A］<code>+</code> … 足し算だと 20 + 6 ＝ 26。個数と人数という種類のちがう数を足しても、あまりの個数にはなりません</li>
            </ul>
