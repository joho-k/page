            <h1>第58問 15分後は何時何分？（時刻のくり上がり）</h1>
            <p>いまの時刻は9時45分です。15分後の時刻を「10時0分」のように表示しよう。時は ji、分は fun に入っています。fun に15をたしたあと、分が60以上になったら、60分を1時間にくり上げます。くり上げるかどうかを決める記号と、分の直し方の2か所の穴をうめよう</p>
            <p>難易度：★★☆☆☆（2／やさしい）。単元：条件分岐。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>ji = 9
fun = 45
fun = fun + 15
もし fun ［A］ 60 ならば:
  fun = fun ［B］ 60
  ji = ji + 1
表示する(ji + &quot;時&quot; + fun + &quot;分&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>&gt;</code></li>
                <li><code>&gt;=</code></li>
                <li><code>&lt;</code></li>
                <li><code>+</code></li>
                <li><code>-</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>時計の分は 0 から 59 までで、60分になったら1時間にくり上がります。45 + 15 ＝ 60 なので、60 ちょうどのときもくり上げたい。だから条件は fun &gt;= 60 です。くり上げるときは、分から 60 をひいて（60 - 60 ＝ 0）、時に 1 をたします（9 + 1 ＝ 10）。「10時0分」と表示されれば正解です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>&gt;=</code></li>
            <li>空欄 ［B］ … <code>-</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>&gt;</code>　［B］<code>-</code> … 45 + 15 で fun はちょうど 60 になります。60 &gt; 60 は「60は60より大きい」なので偽になり、くり上がらずに「9時60分」と表示されてしまいます。60分ちょうどは1時間なので、60 もふくむ &gt;= を使います</li>
            <li>［A］<code>&lt;</code>　［B］<code>-</code> … 60 &lt; 60 は偽なので、くり上がらずに「9時60分」になります。しかも &lt; だと、分が 30 のように60より小さいときにくり上がってしまい、動きが逆です。「60以上」は &gt;= で書きます</li>
            <li>［A］<code>&gt;=</code>　［B］<code>+</code> … くり上げる条件は合っています。でも fun = fun + 60 だと 60 + 60 ＝ 120 になり、「10時120分」と表示されてしまいます。60分を1時間として時のほうへ移すので、分からは 60 をひきます</li>
            <li>［A］<code>&gt;</code>　［B］<code>+</code> … 2か所とも違います。60 &gt; 60 は偽なのでくり上がらず「9時60分」になります。さらに、くり上がったときも fun + 60 では分がふえてしまいます。条件は &gt;=、分の直し方は - です</li>
            <li>［A］<code>&lt;</code>　［B］<code>+</code> … 2か所とも違います。60 &lt; 60 は偽なのでくり上がらず「9時60分」になります。条件は「60以上」なので &gt;=、くり上げたら分から 60 をひくので - です</li>
            </ul>
