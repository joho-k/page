            <h1>第58問 100日後は何曜日？（あまりでひとまわり）</h1>
            <p>曜日を配列 youbi に並べました（youbi[0] が日曜日、youbi[1] が月曜日…）。今日は水曜日なので youbi[3] です。曜日は7日でひとまわりすることを使って、今日から100日後が何曜日になるかを表示しよう（空欄は2つ）。</p>
            <p>難易度：★★★☆☆（3／標準）。単元：配列。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>youbi = [&quot;日&quot;,&quot;月&quot;,&quot;火&quot;,&quot;水&quot;,&quot;木&quot;,&quot;金&quot;,&quot;土&quot;]
kyou = 3
hi = 100
saki = (kyou + hi) ［A］ ［B］
表示する(&quot;今日から&quot; + hi + &quot;日後は&quot; + youbi[saki] + &quot;曜日です&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>%</code></li>
                <li><code>/</code></li>
                <li><code>*</code></li>
                <li><code>6</code></li>
                <li><code>7</code></li>
                <li><code>24</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>水曜日は youbi[3] なので、3 + 100 = 103 が「日曜日から数えた番号」になります。曜日は7日でひとまわりするので、103 を 7 でわったあまりを出せば 0〜6 の添字にもどせます。あまりを出す記号は % です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>%</code></li>
            <li>空欄 ［B］ … <code>7</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>%</code>　［B］<code>6</code> … 曜日は日・月・火・水・木・金・土の7つでひとまわりします。6 でわると 103 % 6 = 1 になり、youbi[1] の月曜日になってしまいます。わる数は曜日の個数と同じ 7 です</li>
            <li>［A］<code>%</code>　［B］<code>24</code> … 24 は1日の時間の数です。いまひとまわりさせたいのは曜日なので、103 % 24 = 7 となり、配列 youbi の範囲（0〜6）からはみ出してしまいます。わる数は 7 です</li>
            <li>［A］<code>/</code>　［B］<code>7</code> … / は商を出す記号なので 103 / 7 = 14.71… という小数になり、youbi の添字として使えません。ほしいのは「7でわったあまり」なので % を使います</li>
            <li>［A］<code>/</code>　［B］<code>6</code> … 2か所ちがいます。ひとまわりの計算に使うのは、わり算の商（/）ではなく、あまり（%）です。そして曜日は7つなので、わる数も 7 になります</li>
            <li>［A］<code>*</code>　［B］<code>7</code> … * でかけると 103 * 7 = 721 になり、どんどん大きくなってしまいます。ひとまわりさせたいときは、7 でわったあまり（%）を使うと 0〜6 におさまります</li>
            </ul>
