    <noscript>
        <article>
            <h1>第62問 ポイントカードの残り（代入で上書き）</h1>
            <p>ポイントカードに100ポイントたまっています。買い物で50ポイント増えたあと、30ポイント使いました。いま残っているポイントが表示されるようにしよう。point = point + 50 のように書くと、「いまの point に 50 を足して、その結果を point に入れなおす」という意味になります</p>
            <p>難易度：★☆☆☆☆（1／入門）。単元：変数と代入。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>point = 100
point = point + 50
point = ［A］ - 30
表示する(&quot;残りは&quot; + point + &quot;ポイント&quot;)</code></pre>
            <p>空欄 ［A］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>point</code></li>
                <li><code>100</code></li>
                <li><code>50</code></li>
                <li><code>30</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>= は「同じ」ではなく「右を計算して、左の変数に入れる」という意味です。point は 100 → 100 + 50 ＝ 150 → 150 - 30 ＝ 120 と、行が進むたびに新しい値に上書きされます。答えは120ポイントです</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>point</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>100</code> … 100 - 30 ＝ 70 となり、買い物で増えた50ポイントが消えてしまいます。100 は最初の値です。いまの値は point に入っているので、それを使いましょう</li>
            <li>［A］<code>50</code> … 50 - 30 ＝ 20 となり、もともとの100ポイントが消えてしまいます。50 は増えた分だけの数です。全部のポイントは point に入っています</li>
            <li>［A］<code>30</code> … 30 - 30 ＝ 0 となり、ポイントが全部なくなってしまいます。30 は使った分の数です。使う前のポイントは point に入っています</li>
            </ul>
