            <h1>第61問 2進数の1011はいくつ？</h1>
            <p>コンピュータの中の数は2進数で表されています。2進数の各桁には「位の重み」があり、4桁なら左から 8, 4, 2, 1 です。桁の数字が1ならその重みのぶんだけ数え、0なら数えずに、全部の桁を合計すると10進数の値になります。配列 bits（＝[1,0,1,1]）には、2進数の1011が左の桁から順に入っています。重み omomi を8から始めて、右の桁へ進むたびに半分にしながら、10進数に直すプログラムを完成させよう（2か所の穴をうめよう）</p>
            <p>難易度：★★★☆☆（3／標準）。単元：繰り返し・配列。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>bits = [1,0,1,1]
omomi = 8
kekka = 0
i を 0 から 3 まで 1 ずつ増やしながら繰り返す:
  atai = bits[i] ［A］ omomi
  kekka = kekka + atai
  omomi = omomi ［B］ 2
表示する(&quot;2進数の1011は10進数で&quot; + kekka + &quot;です&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>左の桁から順に「桁の数字 * 重み」を計算すると、1の桁は重みのまま、0の桁は0になります。これを kekka にたしていき、右へ進むたびに重みを2でわって 8→4→2→1 と半分にします。1011 は 8 + 0 + 2 + 1 ＝ 11 です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>*</code></li>
            <li>空欄 ［B］ … <code>/</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>+</code>　［B］<code>/</code> … 重みを半分にするところは正解です。でも + だと、桁の数字が0のところでも 0 + 4 ＝ 4 と重みのぶんが数えられてしまい、結果は18になります。1なら重みのまま、0なら0にしたいので、かけ算にしましょう</li>
            <li>［A］<code>-</code>　［B］<code>/</code> … 重みを半分にするところは正解です。でも - だと 1 - 8 ＝ -7 とマイナスになり、結果は-12になります。1なら重みのまま、0なら0にしたいので、かけ算にしましょう</li>
            <li>［A］<code>/</code>　［B］<code>/</code> … 重みを半分にするところは正解です。でも / だと 1 / 8 ＝ 0.125 と小さくなり、結果は1.625になります。1なら重みのまま、0なら0にしたいので、かけ算にしましょう</li>
            <li>［A］<code>%</code>　［B］<code>/</code> … 重みを半分にするところは正解です。でも % はわり算のあまりで、1 % 8 ＝ 1 となり、桁の重みが値に反映されません。結果は2になります。1なら重みのまま、0なら0にしたいので、かけ算にしましょう</li>
            <li>［A］<code>*</code>　［B］<code>*</code> … 桁の値を出すところは正解です。でも * だと重みが 8→16→32→64 と増えていき、結果は104になります。右の桁へ進むほど重みは 8→4→2→1 と半分になるので、2でわりましょう</li>
            <li>［A］<code>*</code>　［B］<code>-</code> … 桁の値を出すところは正解です。でも - だと重みが 8→6→4→2 と2ずつ減るだけで、結果は14になります。2進数の重みは 8→4→2→1 と半分ずつ小さくなるので、2でわりましょう</li>
            <li>［A］<code>*</code>　［B］<code>+</code> … 桁の値を出すところは正解です。でも + だと重みが 8→10→12→14 と増えていき、結果は34になります。右の桁へ進むほど重みは 8→4→2→1 と半分になるので、2でわりましょう</li>
            <li>［A］<code>*</code>　［B］<code>%</code> … 桁の値を出すところは正解です。でも % は「あまり」なので、8 % 2 ＝ 0 で重みが0になり、それより右の桁が数えられません。結果は8になります。半分にするには2でわりましょう</li>
            </ul>
