            <h1>第49問 パケットは何個必要？（切り上げ）</h1>
            <p>インターネットでは、データを「パケット」という小さなかたまりに分けて送ります。8000バイトのデータを、1個に1500バイトまで入るパケットで送るとき、パケットは何個必要かを表示しよう。まず、いっぱいまで詰めたパケットが何個できるかを wari で計算して切り捨て、そこに入りきらずに残るデータ（あまり）を求めます。残りが少しでもあるなら、そのぶんをのせるパケットがもう1個いります。あてはまる記号を選ぼう（3か所の穴をうめよう）</p>
            <p>難易度：★★★☆☆（3／標準）。単元：条件分岐。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>data = 8000
size = 1500
wari = data ［A］ size
manpai = 切り捨て(wari)
amari = data ［B］ size
もし amari ［C］ 0 ならば:
  kosuu = manpai
そうでなければ:
  kosuu = manpai + 1
表示する(&quot;いっぱいのパケットは&quot; + manpai + &quot;個&quot;)
表示する(&quot;入りきらない残りは&quot; + amari + &quot;バイト&quot;)
表示する(&quot;必要なパケットは&quot; + kosuu + &quot;個&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
                <li><code>==</code></li>
                <li><code>!=</code></li>
                <li><code>&gt;</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>「何個に分ける？」は切り上げの計算です。8000 / 1500 ＝ 5.33… を切り捨てた 5 個と、あまり 8000 % 1500 ＝ 500 バイトを別々に求め、あまりが0でなければ 5 に1をたします。8000バイトなら 5 + 1 ＝ 6 個です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>/</code></li>
            <li>空欄 ［B］ … <code>%</code></li>
            <li>空欄 ［C］ … <code>==</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>%</code>　［B］<code>%</code>　［C］<code>==</code> … 1つ目の wari は「いっぱいまで詰めたパケットが何個ぶんか」なので、わり算です。% だと 8000 % 1500 ＝ 500 とあまりのほうが出てしまい、切り捨てても500個のままです。8000 / 1500 ＝ 5.33… を切り捨てて 5 個と求めましょう</li>
            <li>［A］<code>/</code>　［B］<code>/</code>　［C］<code>==</code> … 2つ目は「入りきらずに残るデータ」です。/ だと 8000 / 1500 ＝ 5.33… となり、残りが5.33バイトという意味の分からない値になります。あまりを出す % を使って 8000 % 1500 ＝ 500 バイトと求めましょう</li>
            <li>［A］<code>/</code>　［B］<code>-</code>　［C］<code>==</code> … パケットは5個ぶん詰めているので、ひくなら 8000 - 1500 * 5 です。- だと1個ぶんの 8000 - 1500 ＝ 6500 しかひけません。何個ぶんでも一度にひいてくれる % を使いましょう</li>
            <li>［A］<code>/</code>　［B］<code>%</code>　［C］<code>!=</code> … この if は「残りが0のとき（ぴったり収まったとき）」に manpai をそのまま使う形です。!= だと残り500バイトのときに manpai ＝ 5 個となり、あまった500バイトを運ぶパケットが足りません。残りが0かどうかを == でたずねましょう</li>
            <li>［A］<code>/</code>　［B］<code>%</code>　［C］<code>&gt;</code> … &gt; だと「残りがある」ときに manpai をそのまま使うことになり、5個で止まってしまいます。もう1個いるのは残りがあるときなので、条件は == で「残りが0のとき」だけ manpai のまま、という向きにします</li>
            </ul>
