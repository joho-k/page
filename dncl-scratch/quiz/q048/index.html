            <h1>第48問 50時間後は何時？（時計のひとまわり）</h1>
            <p>いまは14時です。50時間後は何時になるでしょうか。時計は24時間でちょうどひとまわりして0時にもどります。まず今の時刻に経過した時間をたし、そのあと「24でわったあまり」を求めると、ひとまわりしたぶんを取りのぞいた時刻がわかります（2か所の穴をうめよう）</p>
            <p>難易度：★★☆☆☆（2／やさしい）。単元：変数と代入。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>ima = 14
keika = 50
goukei = ima ［A］ keika
jikoku = goukei ［B］ 24
表示する(&quot;たすと&quot; + goukei + &quot;時、ひとまわりを取りのぞくと&quot; + jikoku + &quot;時です&quot;)</code></pre>
            <p>空欄 ［A］・［B］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>手順は2つ。①今の時刻に経過時間をたす（14 + 50 ＝ 64）②24でわったあまりを求める（64 % 24 ＝ 16）。24時間でひとまわりして0にもどるものは、% 24 で「今どこにいるか」が一発で出せます。曜日（% 7）や分・秒（% 60）も同じ考え方です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>+</code></li>
            <li>空欄 ［B］ … <code>%</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>+</code>　［B］<code>/</code> … / はわり算の「商」なので、64 / 24 ＝ 2.66… となり「何回ひとまわりしたか」に近い数が出ます。知りたいのはひとまわりしたあとに残る時刻なので、あまりを出す % を使いましょう</li>
            <li>［A］<code>+</code>　［B］<code>-</code> … 64 - 24 ＝ 40 では、まだ24をこえているので時計の時刻になっていません。24を何回でも引ける「あまり」の考え方が % です。% なら一度で 64 % 24 ＝ 16 が出ます</li>
            <li>［A］<code>+</code>　［B］<code>+</code> … 64 + 24 ＝ 88 では、時刻がさらに大きくなってしまいます。ひとまわりぶんを取りのぞきたいので、たし算ではなく、あまりを出す % を使います</li>
            <li>［A］<code>+</code>　［B］<code>*</code> … 64 * 24 ＝ 1536 では時刻とかけはなれてしまいます。24時間でひとまわりすることを式にするなら、24でわったあまり（%）です</li>
            <li>［A］<code>-</code>　［B］<code>%</code> … 14 - 50 ＝ -36 と、時刻がマイナスになってしまいます。50時間「後」なので、今の時刻に経過時間をたす + が正しいです</li>
            <li>［A］<code>*</code>　［B］<code>%</code> … 14 * 50 ＝ 700 は、14時が50個ぶんという意味になってしまいます。時刻を先に進めたいだけなので、たし算の + を使いましょう</li>
            <li>［A］<code>/</code>　［B］<code>%</code> … 14 / 50 ＝ 0.28 では時刻になりません。50時間後の時刻を知りたいので、まず 14 + 50 ＝ 64 と、今の時刻に経過時間をたします</li>
            <li>［A］<code>%</code>　［B］<code>%</code> … 14 % 50 ＝ 14 となり、時間がまったく進みません。1つめの穴は「時刻を進める」ところなので + です。あまりを使うのは2つめの穴だけです</li>
            </ul>
