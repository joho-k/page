        <article>
            <h1>第37問 バーコードのチェックディジット</h1>
            <p>商品のバーコードの末尾にある「チェックディジット」は、読みまちがいを見つけるための1桁の数字です。7桁の番号 code（＝4912347）から、下の桁（一の位）を1番目として、奇数番目の数字を3倍、偶数番目の数字を1倍して合計 gokei を出します。その合計を10でわったあまり amari を10からひき、さらに1桁におさめてチェックディジットを求めます（3か所の穴をうめよう）</p>
            <p>難易度：★★★★★（5／難しい）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>code = 4912347
gokei = 0
i を 1 から 7 まで 1 ずつ増やしながら繰り返す:
  keta = code ［A］ 10
  もし i % 2 == 1 ならば:
    omomi = 3
  そうでなければ:
    omomi = 1
  gokei = gokei + keta ［B］ omomi
  code = 切り捨て(code / 10)
amari = gokei % 10
check = (10 - amari) ［C］ 10
表示する(&quot;チェックディジットは&quot; + check + &quot;です&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>一の位は code % 10 で取り出し、重みは keta * omomi でかけます。最後がポイントで、gokei ＝ 60 なら amari ＝ 0、10 - 0 ＝ 10 は2桁なので、% 10 でもう一度あまりを取って0にもどします。答えは0です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>%</code></li>
            <li>空欄 ［B］ … <code>*</code></li>
            <li>空欄 ［C］ … <code>%</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>/</code>　［B］<code>*</code>　［C］<code>%</code> … 1つ目は「一の位の数字」を取り出すところです。/ だと商になり、4912347 / 10 ＝ 491234.7 で1桁の数字になりません。あまりを出す % を使って 4912347 % 10 ＝ 7 としましょう</li>
            <li>［A］<code>+</code>　［B］<code>*</code>　［C］<code>%</code> … たし算では 4912347 + 10 ＝ 4912357 となり、一の位を取り出せません。一の位は10でわったあまりなので % を使います</li>
            <li>［A］<code>%</code>　［B］<code>+</code>　［C］<code>%</code> … 重み omomi は「かける」ものです。keta + omomi だと 7 + 3 ＝ 10 となり、3倍したことになりません。keta * omomi で 7 * 3 ＝ 21 とします</li>
            <li>［A］<code>%</code>　［B］<code>/</code>　［C］<code>%</code> … わり算では 7 / 3 ＝ 2.33… と小数になり、3倍の重みになりません。「3倍」はかけ算なので * を使います</li>
            <li>［A］<code>%</code>　［B］<code>%</code>　［C］<code>%</code> … % はあまりです。keta % omomi だと 7 % 3 ＝ 1 となり、重みをかけたことになりません。3倍するのは * です</li>
            <li>［A］<code>%</code>　［B］<code>*</code>　［C］<code>-</code> … この番号ではあまりが0なので (10 - 0) - 10 ＝ 0 とたまたま合いますが、あまりが4のときは (10 - 4) - 10 ＝ -6 とマイナスになってしまいます。10でわったあまりを取る % なら、いつでも0〜9におさまります</li>
            <li>［A］<code>%</code>　［B］<code>*</code>　［C］<code>/</code> … わり算だと (10 - 0) / 10 ＝ 1 となり、正しい0になりません。ほしいのは商ではなく「10でわったあまり」なので % を使います</li>
            <li>［A］<code>%</code>　［B］<code>*</code>　［C］<code>+</code> … たし算だと (10 - 0) + 10 ＝ 20 となり、1桁のチェックディジットになりません。10になってしまったときに0へもどすため % を使います</li>
            </ul>
