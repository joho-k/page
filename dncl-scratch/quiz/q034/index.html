        <article>
            <h1>第34問 必要な箱の数（切り上げ）</h1>
            <p>おかしが23個あります。1箱に6個ずつ入れて箱づめするとき、全部しまうには箱が何箱必要でしょうか。まず23と6から商 shou を求めて切り捨て、6個ずつぴったり入る箱の数 hako にします。次にあまりの個数を求め、あまりが1個でも残っていたらもう1箱使います（3か所の穴をうめよう）</p>
            <p>難易度：★★★☆☆（3／標準）。共通テスト「情報I」で使われるDNCL（共通テスト用プログラム表記）の穴埋め問題です。JavaScriptを有効にすると、このページでプログラムを組み立てて実行しながら解けます。</p>

            <h2>プログラム</h2>
            <pre><code>kosu = 23
iri = 6
shou = kosu ［A］ iri
hako = 切り捨て(shou)
amari = kosu ［B］ iri
もし amari ［C］ 0 ならば:
  hako = hako + 1
表示する(&quot;あまりは&quot; + amari + &quot;個、必要な箱は&quot; + hako + &quot;箱です&quot;)</code></pre>
            <p>空欄 ［A］・［B］・［C］ に当てはまるものを、次の選択肢から選びます。</p>

            <h2>選択肢</h2>
            <ul>
                <li><code>+</code></li>
                <li><code>-</code></li>
                <li><code>*</code></li>
                <li><code>/</code></li>
                <li><code>%</code></li>
                <li><code>&gt;</code></li>
                <li><code>&lt;</code></li>
                <li><code>==</code></li>
            </ul>

            <h2>ヒント</h2>
            <p>23 ÷ 6 ＝ 3 あまり 5。商 shou は kosu / iri で 3.833…、これを切り捨てて3箱、残りは kosu % iri で5個です。あまりが0より大きいときはもう1箱いるので、答えは4箱。このように「わり算のあと、あまりがあれば1つ増やす」のが切り上げの考え方です</p>

            <h2>解答</h2>
            <ul>
            <li>空欄 ［A］ … <code>/</code></li>
            <li>空欄 ［B］ … <code>%</code></li>
            <li>空欄 ［C］ … <code>&gt;</code></li>
            </ul>
            <h2>よくある間違い</h2>
            <ul>
            <li>［A］<code>%</code>　［B］<code>%</code>　［C］<code>&gt;</code> … 1つ目は「6個ずつ何箱ぶん入るか」なのでわり算です。% だと shou に 23 % 6 ＝ 5 とあまりの方が入ってしまい、箱が6箱も必要という答えになります。/ を使いましょう</li>
            <li>［A］<code>/</code>　［B］<code>/</code>　［C］<code>&gt;</code> … 2つ目は「入りきらずに残った個数」なので、わり算のあまりを求める % です。/ だと「あまりは3.8333…個」と小数で表示されてしまい、個数になりません。正しくは 23 % 6 ＝ 5個です</li>
            <li>［A］<code>/</code>　［B］<code>%</code>　［C］<code>==</code> … == だと「あまりがちょうど0のとき」だけ箱を増やすことになります。23 % 6 ＝ 5 なので箱は3箱のままで、18個しか入らず5個あふれてしまいます。あまりが残っているとき（&gt; 0）に増やしましょう</li>
            <li>［A］<code>/</code>　［B］<code>%</code>　［C］<code>&lt;</code> … あまりは必ず0以上なので、amari &lt; 0 は決して成り立ちません。箱は3箱のままで、あまりの5個を入れる箱がなくなります。&gt; を使いましょう</li>
            <li>［A］<code>*</code>　［B］<code>%</code>　［C］<code>&gt;</code> … * だと shou が 23 * 6 ＝ 138 になり、箱が139箱も必要なことになってしまいます。23個を6個ずつに「分ける」ので / を使いましょう</li>
            <li>［A］<code>/</code>　［B］<code>-</code>　［C］<code>&gt;</code> … - だと「あまりは17個」と表示されてしまいます。1箱に6個ずつ何回も入れたあとの残りを知りたいので、あまりを求める % を使いましょう。23 % 6 ＝ 5個です</li>
            </ul>
